function obtenerRecomendacion(riesgo) {
  const texto = riesgo.toLowerCase();
  if (texto.includes("alto"))
    return "🔴 Se recomienda usar un catéter Midline largo.";
  if (texto.includes("moderado") || texto.includes("medio"))
    return "🟡 Se recomienda usar un catéter Midline largo o corto. Evaluar duración del tratamiento.";
  if (texto.includes("bajo"))
    return "🟢 Se recomienda usar un catéter venoso periférico corto o con sistema integrado (NEXIVA). Evaluar duración del tratamiento.";
  return "";
}



function obtenerColorRiesgo(riesgo) {
  const texto = riesgo.toLowerCase();
  if (texto.includes("alto")) return "#f8d7da";       // rojo claro
  if (texto.includes("moderado")) return "#fff3cd";   // amarillo claro
  if (texto.includes("bajo")) return "#d4edda";        // verde claro
  return "#f0f0f0"; // gris claro por defecto
}


  function textoRiesgo(riesgo) {
  const texto = riesgo.toLowerCase();
  if (texto.includes("alto")) return "alto";
  if (texto.includes("moderado") || texto.includes("medio")) return "moderado";
  if (texto.includes("bajo")) return "bajo";
  return "";
}

function mostrarResultados(filtro) {
    resultados.innerHTML = '';
    medicamentos
      .filter(m => m.nombre.toLowerCase().includes(filtro.toLowerCase()))
      .forEach(m => {
        const div = document.createElement('div');
        div.className = 'medicamento';
div.style.backgroundColor = obtenerColorRiesgo(m.riesgo);
        div.innerHTML = `
          <div class="titulo">${m.nombre}</div>
          <div class="campo"><span class="label">Reconstitución:</span> ${m.reconstitucion}</div>
          <div class="campo"><span class="label">Dilución:</span> ${m.dilucion}</div>
          <div class="campo"><span class="label">Velocidad:</span> ${m.velocidad}</div>
          <div class="campo"><span class="label">Estabilidad:</span> ${m.estabilidad}</div>
          <div class="campo"><span class="label">pH:</span> ${m.ph}</div>
          <div class="campo"><span class="label">Osmolaridad:</span> ${m.osmolaridad}</div>
          <div class="campo"><span class="label">Riesgo:</span> ${m.riesgo}<div class="recomendacion ${textoRiesgo(m.riesgo)}">${obtenerRecomendacion(m.riesgo)}</div></div>
        `;
        resultados.appendChild(div);
      });
  }

  buscador.addEventListener('input', e => mostrarResultados(e.target.value));
